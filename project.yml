name: ContactProviderCleanup
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CLEANUP_APP_GROUP: group.$(CLEANUP_BUNDLE_ID)
configFiles:
  Debug: Config/Identity.xcconfig
  Release: Config/Identity.xcconfig
targets:
  ContactProviderCleanup:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: Provider
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLEANUP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: 連絡先の掃除
        CFBundleDevelopmentRegion: ja
        CleanupAppGroup: $(CLEANUP_APP_GROUP)
        NSContactsUsageDescription: 残っている連絡先の件数を数えます。
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  Provider:
    type: extensionkit-extension
    platform: iOS
    sources:
      - Provider
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLEANUP_BUNDLE_ID).$(CLEANUP_EXTENSION_NAME)
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
    info:
      path: Config/Provider-Info.plist
      properties:
        CFBundleDisplayName: $(CLEANUP_PROVIDER_NAME)
        CFBundleDevelopmentRegion: ja
        CleanupAppGroup: $(CLEANUP_APP_GROUP)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.contact.provider.extension
schemes:
  ContactProviderCleanup:
    build:
      targets:
        ContactProviderCleanup: all
    run:
      config: Debug
